name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: go test ./...
      - run: /bin/sh tests/install_integration_test.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify the pinned OpenCode patch
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/opencode-home"
          git init "$source_dir"
          git -C "$source_dir" fetch --depth=1 https://github.com/anomalyco/opencode.git cd9a14a6b688d4021bee381dfd39d2cef9c0f862
          git -C "$source_dir" checkout --detach FETCH_HEAD
          git -C "$source_dir" apply --check "$GITHUB_WORKSPACE/patches/opencode-2.0.18-home-logo.patch"
